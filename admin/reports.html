<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | Star Vedic Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="sidebar-logo-inner">
                <div class="sb-logo-icon"><i class="fas fa-om"></i></div>
                <div>
                    <div class="sb-logo-text">Star Vedic Academy</div>
                    <div class="sb-logo-sub">Admin Panel</div>
                </div>
            </div>
        </div>
        <nav>
            <div class="sidebar-section">Main</div>
            <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="classes.html"><i class="fas fa-book-open"></i> Manage Classes</a>
            <a href="students.html"><i class="fas fa-users"></i> Manage Students</a>
            <a href="reports.html" class="active"><i class="fas fa-chart-bar"></i> Reports</a>
        </nav>
        <div class="sidebar-footer"><a href="../index.html"><i class="fas fa-sign-out-alt"></i> Back to Site</a></div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <div class="topbar">
        <div><button class="mob-sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="topbar-title">Reports & Analytics</div>
        </div>
        <div class="topbar-right"><button class="notif-btn"><i class="fas fa-bell"></i>
                <div class="notif-dot"></div>
            </button>
            <div class="admin-chip">
                <div class="admin-av">A</div><span class="admin-name">Admin</span>
            </div>
        </div>
    </div>

    <div class="content">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
            <button class="btn-sm btn-gold-sm" id="exportExcelBtn"><i class="fas fa-file-excel"></i> Export Complete
                Report (Excel)</button>
            <button class="btn-sm btn-primary-sm" id="refreshReportBtn"><i class="fas fa-sync-alt"></i> Refresh
                Report</button>
        </div>

        <div class="table-card">
            <div class="table-header">
                <h3><i class="fas fa-file-alt"></i> Full Enrollment & Fee Report</h3>
            </div>
            <div style="overflow-x:auto;">
                <table id="fullReportTable" width="100%">
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Phone</th>
                            <th>Enrolled Courses</th>
                            <th>Fee Status</th>
                            <th>Amount Paid</th>
                            <th>Join Date</th>
                        </tr>
                    </thead>
                    <tbody id="reportTbody"></tbody>
                </table>
            </div>
        </div>

        <!-- Optional: quick summary cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-card-top">
                    <div class="stat-icon" style="background:#EDE7FF"><i class="fas fa-graduation-cap"></i></div>
                </div>
                <div class="stat-num" id="totalStudentsStat">0</div>
                <div class="stat-lbl">Total Students</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-top">
                    <div class="stat-icon" style="background:#E8F5E9"><i class="fas fa-check-circle"></i></div>
                </div>
                <div class="stat-num" id="totalPaidStat">0</div>
                <div class="stat-lbl">Fully Paid</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-top">
                    <div class="stat-icon" style="background:#FFF3E0"><i class="fas fa-rupee-sign"></i></div>
                </div>
                <div class="stat-num" id="totalRevenueStat">₹0</div>
                <div class="stat-lbl">Total Revenue</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="admin.js"></script>
    <script>
        // additional summary update
        function updateSummary() {
            document.getElementById('totalStudentsStat').innerText = STUDENTS.length;
            const paid = STUDENTS.filter(s => s.paid).length;
            document.getElementById('totalPaidStat').innerText = paid;
            const revenue = paid * 280;
            document.getElementById('totalRevenueStat').innerText = `₹${revenue}`;
        }
        // override init to also show summary
        const originalInit = document.addEventListener('DOMContentLoaded', () => {
            if (window.location.pathname.includes('reports.html')) {
                generateFullReportTable();
                updateSummary();
                document.getElementById('exportExcelBtn')?.addEventListener('click', exportFullReport);
                document.getElementById('refreshReportBtn')?.addEventListener('click', () => { generateFullReportTable(); updateSummary(); });
            }
        });
    </script>
</body>

</html>
