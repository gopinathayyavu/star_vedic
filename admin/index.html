<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Star Vedic Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="sidebar-logo-inner">
                <div class="sb-logo-icon"><i class="fas fa-om"></i></div>
                <div>
                    <div class="sb-logo-text">Star Vedic Academy</div>
                    <div class="sb-logo-sub">Admin Panel</div>
                </div>
            </div>
        </div>
        <nav>
            <div class="sidebar-section">Main</div>
            <a href="index.html" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="classes.html"><i class="fas fa-book-open"></i> Manage Classes</a>
            <a href="students.html"><i class="fas fa-users"></i> Manage Students</a>
            <a href="reports.html"><i class="fas fa-chart-bar"></i> Reports</a>
        </nav>
        <div class="sidebar-footer"><a href="../index.html"><i class="fas fa-sign-out-alt"></i> Back to Site</a></div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <div class="topbar">
        <div><button class="mob-sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="topbar-title">Dashboard</div>
        </div>
        <div class="topbar-right"><button class="notif-btn"><i class="fas fa-bell"></i>
                <div class="notif-dot"></div>
            </button>
            <div class="admin-chip">
                <div class="admin-av">A</div><span class="admin-name">Admin</span>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-card-top">
                    <div class="stat-icon" style="background:#EDE7FF;color:#7B1FA2"><i class="fas fa-users"></i></div>
                    <span class="stat-trend trend-up">+12%</span>
                </div>
                <div class="stat-num">247</div>
                <div class="stat-lbl">Total Students</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-top">
                    <div class="stat-icon" style="background:#E8F5E9;color:#2E7D32"><i class="fas fa-book-open"></i>
                    </div><span class="stat-trend trend-up">+3</span>
                </div>
                <div class="stat-num">35</div>
                <div class="stat-lbl">Active Classes</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-top">
                    <div class="stat-icon" style="background:#FFF3E0;color:#E65100"><i class="fas fa-rupee-sign"></i>
                    </div><span class="stat-trend trend-up">+8%</span>
                </div>
                <div class="stat-num">₹69,160</div>
                <div class="stat-lbl">Monthly Revenue</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-top">
                    <div class="stat-icon" style="background:#FCE4EC;color:#C62828"><i class="fas fa-certificate"></i>
                    </div><span class="stat-trend trend-up">+18</span>
                </div>
                <div class="stat-num">86</div>
                <div class="stat-lbl">Certificates Issued</div>
            </div>
        </div>

        <div class="table-card">
            <div class="table-header">
                <h3><i class="fas fa-user-graduate" style="color:var(--gold)"></i> Recent Enrollments</h3><a
                    href="students.html" class="btn-sm btn-primary-sm"><i class="fas fa-eye"></i> View All</a>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Enrolled Courses</th>
                        <th>Fee Status</th>
                        <th>Joined</th>
                    </tr>
                </thead>
                <tbody id="recentStudentsTbody"></tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="admin.js"></script>
</body>

</html>
