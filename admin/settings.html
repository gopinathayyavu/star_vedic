<!-- Settings page -->
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Settings Management</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- TAILWIND -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0F2C23',
                        secondary: '#1A3F34',
                        gold: '#D4AF37',
                        accent: '#F28C28',
                        bgsoft: '#F8F6F2',
                    },
                    fontFamily: {
                        display: ['Playfair Display', 'serif'],
                        body: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #F8F6F2;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .menu-item.active {
            background: linear-gradient(to right, #D4AF37, #F28C28);
            color: #0F2C23;
            font-weight: 700;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .settings-tab.active {
            background: #0F2C23;
            color: white;
        }

        .mobile-sidebar {
            transition: all 0.3s ease;
        }

        @media(max-width:1024px) {
            .mobile-sidebar {
                transform: translateX(-100%);
            }

            .mobile-sidebar.open {
                transform: translateX(0);
            }
        }
    </style>

</head>

<body>

    <div class="flex min-h-screen">

        <!-- SIDEBAR -->
        <aside id="sidebar"
            class="mobile-sidebar fixed lg:relative z-50 w-[280px] bg-primary text-white h-screen flex flex-col overflow-y-auto">

            <!-- LOGO -->
            <div class="px-6 py-6 border-b border-white/10 flex items-center gap-3">

                <div class="w-11 h-11 rounded-full bg-gold flex items-center justify-center">

                    <i class="fas fa-om text-primary"></i>

                </div>

                <div>

                    <h2 class="font-display text-xl font-bold">
                        STAR VEDIC
                    </h2>

                    <p class="text-xs text-white/60">
                        Admin Dashboard
                    </p>

                </div>

            </div>

            <!-- NAV -->
            <nav class="flex-1 px-4 py-6 space-y-2">

                <a href="#"
                    class="menu-item flex items-center gap-3 px-4 py-3 rounded-xl transition">

                    <i class="fas fa-chart-pie"></i>
                    Dashboard

                </a>

                <a href="#"
                    class="menu-item flex items-center gap-3 px-4 py-3 rounded-xl transition">

                    <i class="fas fa-book-open"></i>
                    Courses

                </a>

                <a href="#"
                    class="menu-item active flex items-center gap-3 px-4 py-3 rounded-xl transition">

                    <i class="fas fa-gear"></i>
                    Settings

                </a>

            </nav>

        </aside>

        <!-- MAIN -->
        <main class="flex-1">

            <!-- TOPBAR -->
            <header
                class="sticky top-0 z-40 bg-white/80 backdrop-blur-lg border-b border-gray-200 px-4 lg:px-8 py-4 flex items-center justify-between">

                <div class="flex items-center gap-4">

                    <!-- MOBILE -->
                    <button id="menuToggle"
                        class="lg:hidden w-10 h-10 rounded-lg bg-primary text-white flex items-center justify-center">

                        <i class="fas fa-bars"></i>

                    </button>

                    <div>

                        <h1 class="text-2xl font-bold text-primary">
                            Settings Management
                        </h1>

                        <p class="text-sm text-gray-500">
                            Configure academy system settings
                        </p>

                    </div>

                </div>

                <!-- SAVE -->
                <button
                    class="bg-gradient-to-r from-gold to-accent text-primary px-6 py-3 rounded-2xl font-bold shadow-lg">

                    <i class="fas fa-floppy-disk mr-2"></i>
                    Save Changes

                </button>

            </header>

            <!-- CONTENT -->
            <section class="p-4 lg:p-8">

                <div class="grid grid-cols-1 xl:grid-cols-4 gap-8">

                    <!-- SETTINGS TABS -->
                    <div class="glass-card rounded-3xl p-5 h-fit">

                        <div class="space-y-3">

                            <button
                                class="settings-tab active w-full text-left px-5 py-4 rounded-2xl font-semibold">

                                <i class="fas fa-building mr-3"></i>
                                General

                            </button>

                            <button
                                class="settings-tab w-full text-left px-5 py-4 rounded-2xl font-semibold bg-gray-100">

                                <i class="fas fa-wallet mr-3"></i>
                                Payments

                            </button>

                            <button
                                class="settings-tab w-full text-left px-5 py-4 rounded-2xl font-semibold bg-gray-100">

                                <i class="fas fa-video mr-3"></i>
                                Zoom

                            </button>

                            <button
                                class="settings-tab w-full text-left px-5 py-4 rounded-2xl font-semibold bg-gray-100">

                                <i class="fas fa-certificate mr-3"></i>
                                Certificates

                            </button>

                            <button
                                class="settings-tab w-full text-left px-5 py-4 rounded-2xl font-semibold bg-gray-100">

                                <i class="fas fa-envelope mr-3"></i>
                                Email

                            </button>

                            <button
                                class="settings-tab w-full text-left px-5 py-4 rounded-2xl font-semibold bg-gray-100">

                                <i class="fas fa-shield-halved mr-3"></i>
                                Security

                            </button>

                        </div>

                    </div>

                    <!-- SETTINGS CONTENT -->
                    <div class="xl:col-span-3 space-y-8">

                        <!-- GENERAL SETTINGS -->
                        <div class="glass-card rounded-3xl p-8">

                            <div class="mb-8">

                                <h2 class="text-3xl font-bold text-primary">
                                    General Settings
                                </h2>

                                <p class="text-gray-500 mt-2">
                                    Manage academy basic information
                                </p>

                            </div>

                            <!-- FORM -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                                <!-- ACADEMY NAME -->
                                <div>

                                    <label
                                        class="block text-sm font-semibold text-primary mb-3">

                                        Academy Name

                                    </label>

                                    <input type="text"
                                        value="Star Vedic Academy"
                                        class="w-full px-5 py-4 rounded-2xl border border-gray-200 outline-none">

                                </div>

                                <!-- PHONE -->
                                <div>

                                    <label
                                        class="block text-sm font-semibold text-primary mb-3">

                                        Phone Number

                                    </label>

                                    <input type="text"
                                        value="+91 98765 43210"
                                        class="w-full px-5 py-4 rounded-2xl border border-gray-200 outline-none">

                                </div>

                                <!-- EMAIL -->
                                <div>

                                    <label
                                        class="block text-sm font-semibold text-primary mb-3">

                                        Email Address

                                    </label>

                                    <input type="email"
                                        value="hello@starvedic.com"
                                        class="w-full px-5 py-4 rounded-2xl border border-gray-200 outline-none">

                                </div>

                                <!-- WEBSITE -->
                                <div>

                                    <label
                                        class="block text-sm font-semibold text-primary mb-3">

                                        Website URL

                                    </label>

                                    <input type="text"
                                        value="www.starvedic.com"
                                        class="w-full px-5 py-4 rounded-2xl border border-gray-200 outline-none">

                                </div>

                            </div>

                            <!-- ADDRESS -->
                            <div class="mt-6">

                                <label
                                    class="block text-sm font-semibold text-primary mb-3">

                                    Academy Address

                                </label>

                                <textarea rows="4"
                                    class="w-full px-5 py-4 rounded-2xl border border-gray-200 outline-none resize-none">Puducherry, India</textarea>

                            </div>

                            <!-- LOGO -->
                            <div class="mt-6">

                                <label
                                    class="block text-sm font-semibold text-primary mb-3">

                                    Academy Logo

                                </label>

                                <div
                                    class="border-2 border-dashed border-gray-300 rounded-3xl p-10 text-center bg-white">

                                    <i
                                        class="fas fa-cloud-arrow-up text-5xl text-gold"></i>

                                    <p class="text-gray-500 mt-4">
                                        Upload academy logo
                                    </p>

                                    <button
                                        class="mt-5 bg-primary text-white px-6 py-3 rounded-2xl font-semibold">

                                        Choose File

                                    </button>

                                </div>

                            </div>

                        </div>

                        <!-- PAYMENT SETTINGS -->
                        <div class="glass-card rounded-3xl p-8">

                            <div class="mb-8">

                                <h2 class="text-3xl font-bold text-primary">
                                    Payment Settings
                                </h2>

                                <p class="text-gray-500 mt-2">
                                    Configure payment gateways
                                </p>

                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                                <!-- RAZORPAY -->
                                <div>

                                    <label
                                        class="block text-sm font-semibold text-primary mb-3">

                                        Razorpay Key

                                    </label>

                                    <input type="text"
                                        placeholder="Enter Razorpay key"
                                        class="w-full px-5 py-4 rounded-2xl border border-gray-200 outline-none">

                                </div>

                                <!-- STRIPE -->
                                <div>

                                    <label
                                        class="block text-sm font-semibold text-primary mb-3">

                                        Stripe Key

                                    </label>

                                    <input type="text"
                                        placeholder="Enter Stripe key"
                                        class="w-full px-5 py-4 rounded-2xl border border-gray-200 outline-none">

                                </div>

                                <!-- UPI -->
                                <div>

                                    <label
                                        class="block text-sm font-semibold text-primary mb-3">

                                        UPI ID

                                    </label>

                                    <input type="text"
                                        placeholder="academy@upi"
                                        class="w-full px-5 py-4 rounded-2xl border border-gray-200 outline-none">

                                </div>

                                <!-- CURRENCY -->
                                <div>

                                    <label
                                        class="block text-sm font-semibold text-primary mb-3">

                                        Currency

                                    </label>

                                    <select
                                        class="w-full px-5 py-4 rounded-2xl border border-gray-200 bg-white outline-none">

                                        <option>INR ₹</option>
                                        <option>USD $</option>

                                    </select>

                                </div>

                            </div>

                        </div>

                        <!-- ZOOM SETTINGS -->
                        <div class="glass-card rounded-3xl p-8">

                            <div class="mb-8">

                                <h2 class="text-3xl font-bold text-primary">
                                    Zoom Settings
                                </h2>

                                <p class="text-gray-500 mt-2">
                                    Configure Zoom integrations
                                </p>

                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                                <!-- API KEY -->
                                <div>

                                    <label
                                        class="block text-sm font-semibold text-primary mb-3">

                                        Zoom API Key

                                    </label>

                                    <input type="text"
                                        placeholder="Enter Zoom API key"
                                        class="w-full px-5 py-4 rounded-2xl border border-gray-200 outline-none">

                                </div>

                                <!-- SECRET -->
                                <div>

                                    <label
                                        class="block text-sm font-semibold text-primary mb-3">

                                        Zoom Secret

                                    </label>

                                    <input type="password"
                                        placeholder="Enter Zoom secret"
                                        class="w-full px-5 py-4 rounded-2xl border border-gray-200 outline-none">

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <script>

        // MOBILE SIDEBAR
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });

    </script>

</body>

</html>
