<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Classes | Star Vedic Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="sidebar-logo-inner">
                <div class="sb-logo-icon"><i class="fas fa-om"></i></div>
                <div>
                    <div class="sb-logo-text">Star Vedic Academy</div>
                    <div class="sb-logo-sub">Admin Panel</div>
                </div>
            </div>
        </div>
        <nav>
            <div class="sidebar-section">Main</div>
            <a href="index.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="classes.html" class="active"><i class="fas fa-book-open"></i> Manage Classes</a>
            <a href="students.html"><i class="fas fa-users"></i> Manage Students</a>
            <a href="reports.html"><i class="fas fa-chart-bar"></i> Reports</a>
        </nav>
        <div class="sidebar-footer"><a href="../index.html"><i class="fas fa-sign-out-alt"></i> Back to Site</a></div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <div class="topbar">
        <div><button class="mob-sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="topbar-title">Manage Classes</div>
        </div>
        <div class="topbar-right"><button class="notif-btn"><i class="fas fa-bell"></i>
                <div class="notif-dot"></div>
            </button>
            <div class="admin-chip">
                <div class="admin-av">A</div><span class="admin-name">Admin</span>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="table-card">
            <div class="table-header">
                <h3><i class="fas fa-book-open" style="color:var(--gold)"></i> All Classes (35)</h3>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <select id="categoryFilter" class="search-input">
                        <option value="">All Categories</option>
                        <option>Health & Wellness</option>
                        <option>Arts & Culture</option>
                        <option>Languages</option>
                        <option>Ladies Special</option>
                        <option>Kids Classes</option>
                    </select>
                    <input type="text" id="classSearch" class="search-input" placeholder="🔍 Search classes...">
                    <button class="btn-sm btn-primary-sm" onclick="openModal('addClass')"><i class="fas fa-plus"></i>
                        Add Class</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Class Name</th>
                        <th>Category</th>
                        <th>Timing</th>
                        <th>Students</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="classesTbody"></tbody>
            </table>
        </div>
    </div>

    <!-- Add Class Modal -->
    <div class="modal-overlay" id="modal-addClass">
        <div class="modal">
            <div class="modal-header">
                <h3>Add New Class</h3><button class="modal-close" onclick="closeModal('addClass')"><i
                        class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group"><label>Class Name *</label><input class="form-control" id="className"
                        placeholder="e.g., Advanced Yoga"></div>
                <div class="form-group"><label>Category *</label><select class="form-control" id="classCat">
                        <option>Health & Wellness</option>
                        <option>Arts & Culture</option>
                        <option>Languages</option>
                        <option>Ladies Special</option>
                        <option>Kids Classes</option>
                    </select></div>
                <div class="form-group"><label>Timing *</label><input class="form-control" id="classTime"
                        placeholder="e.g., 6:00 AM"></div>
            </div>
            <div class="modal-footer"><button class="btn-cancel" onclick="closeModal('addClass')">Cancel</button><button
                    class="btn-save" id="saveClassBtn">Save Class</button></div>
        </div>
    </div>

    <!-- Edit Class Modal (for updating by category) -->
    <div class="modal-overlay" id="modal-editClass">
        <div class="modal">
            <div class="modal-header">
                <h3>Edit Class</h3><button class="modal-close" onclick="closeModal('editClass')"><i
                        class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editClassIndex">
                <div class="form-group"><label>Class Name</label><input class="form-control" id="editClassName"></div>
                <div class="form-group"><label>Category</label><select class="form-control" id="editClassCat">
                        <option>Health & Wellness</option>
                        <option>Arts & Culture</option>
                        <option>Languages</option>
                        <option>Ladies Special</option>
                        <option>Kids Classes</option>
                    </select></div>
                <div class="form-group"><label>Timing</label><input class="form-control" id="editClassTime"></div>
                <div class="form-group"><label>Instructor</label><input class="form-control" id="editClassInstructor">
                </div>
            </div>
            <div class="modal-footer"><button class="btn-cancel"
                    onclick="closeModal('editClass')">Cancel</button><button class="btn-save" id="updateClassBtn">Update
                    Class</button></div>
        </div>
    </div>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="admin.js"></script>
</body>

</html>
