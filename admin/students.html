<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Star Vedic Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="sidebar-logo-inner">
                <div class="sb-logo-icon"><i class="fas fa-om"></i></div>
                <div>
                    <div class="sb-logo-text">Star Vedic Academy</div>
                    <div class="sb-logo-sub">Admin Panel</div>
                </div>
            </div>
        </div>
        <nav>
            <div class="sidebar-section">Main</div>
            <a href="index.html" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="classes.html"><i class="fas fa-book-open"></i> Manage Classes</a>
            <a href="students.html"><i class="fas fa-users"></i> Manage Students</a>
            <a href="reports.html"><i class="fas fa-chart-bar"></i> Reports</a>
        </nav>
        <div class="sidebar-footer"><a href="../index.html"><i class="fas fa-sign-out-alt"></i> Back to Site</a></div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <div class="topbar">
        <div><button class="mob-sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="topbar-title">Students</div>
        </div>
        <div class="topbar-right"><button class="notif-btn"><i class="fas fa-bell"></i>
                <div class="notif-dot"></div>
            </button>
            <div class="admin-chip">
                <div class="admin-av">A</div><span class="admin-name">Admin</span>
            </div>
        </div>
    </div>
    <div class="content">
        <div class="table-card">
            <div class="table-header">
                <h3><i class="fas fa-users"></i> All Students</h3>
                <div><input type="text" id="studentSearch" class="search-input" placeholder="🔍 Search..."
                        oninput="filterStudents(this.value)"><button class="btn-sm btn-primary-sm"
                        onclick="openModal('addStudent')"><i class="fas fa-plus"></i> Add Student</button></div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Courses</th>
                        <th>Fee</th>
                        <th>Joined</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentsTbody"></tbody>
            </table>
        </div>
    </div>
    <!-- Add Student Modal -->
    <div class="modal-overlay" id="modal-addStudent">
        <div class="modal">
            <div class="modal-header">
                <h3>Add New Student</h3><button class="modal-close" onclick="closeModal('addStudent')"><i
                        class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group"><label>Full Name</label><input class="form-control" id="stuName"></div>
                <div class="form-group"><label>Phone Number</label><input class="form-control" id="stuPhone"></div>
            </div>
            <div class="modal-footer"><button class="btn-cancel"
                    onclick="closeModal('addStudent')">Cancel</button><button class="btn-save" id="saveStudentBtn">Save
                    Student</button></div>
        </div>
    </div>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="admin.js"></script>
</body>

</html>
