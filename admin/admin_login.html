<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Admin Login | Star Vedic Academy</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ====== same premium theme as landing & student login ====== */
        :root {
            --primary: #2D2A5E;
            --gold: #F5A623;
            --bg: #FFF9F0;
            --card: #ffffff;
            --text: #1A1A2E;
            --muted: #6A6A8B;
            --radius: 20px;
            --shadow: 0 8px 32px rgba(45, 42, 94, 0.12);
            --shadow-lg: 0 20px 60px rgba(45, 42, 94, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #EDE7FF 0%, #FFF9F0 50%, #FFF3D6 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 60px;
            position: relative;
        }

        /* floating background orbs (matches other pages) */
        body::before {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(245, 166, 35, 0.12), transparent 70%);
            top: -100px;
            right: -100px;
            z-index: -1;
            animation: float1 8s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(45, 42, 94, 0.08), transparent 70%);
            bottom: -100px;
            left: -100px;
            z-index: -1;
            animation: float2 10s ease-in-out infinite;
        }

        @keyframes float1 {

            0%,
            100% {
                transform: translate(0, 0)
            }

            50% {
                transform: translate(-30px, 30px)
            }
        }

        @keyframes float2 {

            0%,
            100% {
                transform: translate(0, 0)
            }

            50% {
                transform: translate(20px, -20px)
            }
        }

        /* login container */
        .login-container {
            max-width: 480px;
            width: 100%;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            border: 1px solid rgba(45, 42, 94, 0.08);
            backdrop-filter: blur(4px);
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary), #5855A0);
            padding: 32px 28px;
            text-align: center;
            color: white;
        }

        .login-header .logo-icon {
            display: inline-flex;
            width: 64px;
            height: 64px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 16px;
        }

        .login-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.85;
            margin-top: 6px;
        }

        .login-body {
            padding: 32px 28px;
        }

        .input-group {
            margin-bottom: 24px;
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 18px;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            border: 1.5px solid rgba(45, 42, 94, 0.12);
            border-radius: 16px;
            outline: none;
            transition: all 0.2s;
            background: #fff;
        }

        .input-group input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.2);
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), #5855A0);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 16px;
            font-family: 'Poppins', sans-serif;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(45, 42, 94, 0.3);
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
        }

        .back-link a {
            color: var(--muted);
            text-decoration: none;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: var(--gold);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0 16px;
            color: var(--muted);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(45, 42, 94, 0.1);
        }

        .error-msg {
            background: #FCE4EC;
            color: #C62828;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
        }

        .wa-note {
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            margin-top: 24px;
        }

        @media (max-width:550px) {
            .login-body {
                padding: 24px 20px;
            }

            .login-header {
                padding: 24px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-header">
            <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
            <h2>Admin Access</h2>
            <p>Secure login for academy management</p>
        </div>
        <div class="login-body">
            <div class="error-msg" id="errorMsg"></div>

            <!-- Username / Email field -->
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="text" id="adminEmail" placeholder="Email or Username" autocomplete="off">
            </div>

            <!-- Password field -->
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="adminPassword" placeholder="Password">
            </div>

            <button class="btn-login" id="adminLoginBtn">Log in as Admin</button>

            <div class="back-link">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
            <div class="wa-note">
                <i class="fab fa-whatsapp"></i> Need help? WhatsApp <strong>9155558584</strong>
            </div>
        </div>
    </div>

    <script>
        // Mock admin credentials (demo)
        const adminCreds = {
            email: "admin@starvedic.com",
            password: "admin123"
        };

        const loginBtn = document.getElementById('adminLoginBtn');
        const emailField = document.getElementById('adminEmail');
        const passField = document.getElementById('adminPassword');
        const errorDiv = document.getElementById('errorMsg');

        function showError(msg) {
            errorDiv.innerText = msg;
            errorDiv.style.display = 'block';
            setTimeout(() => { errorDiv.style.display = 'none'; }, 3000);
        }

        loginBtn.addEventListener('click', () => {
            const email = emailField.value.trim();
            const password = passField.value.trim();

            if (!email || !password) {
                showError('Please enter both email/username and password');
                return;
            }

            // Simple mock validation (case‑insensitive email, exact password)
            if (email.toLowerCase() === adminCreds.email.toLowerCase() && password === adminCreds.password) {
                alert('✅ Admin login successful! Redirecting to Dashboard...');
                window.location.href = 'index.html';   // adjust to your actual admin dashboard path
            } else {
                showError('Invalid credentials. Use admin@starvedic.com / admin123');
            }
        });

        // optional prefilled demo for convenience
        emailField.value = 'admin@starvedic.com';
        passField.value = 'admin123';
    </script>
</body>

</html>
