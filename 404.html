<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Vedik Academy</title>
  <script>
    // GitHub Pages SPA fallback. Preserve the requested React route and
    // let index.html restore it before React Router starts.
    (function () {
      var path = window.location.pathname;
      var search = window.location.search || "";
      var hash = window.location.hash || "";
      var payload = encodeURIComponent(path + search + hash);
      window.location.replace("/?__spa_route=" + payload);
    })();
  </script>
</head>
<body></body>
</html>
