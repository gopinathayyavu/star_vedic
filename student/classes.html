<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>My Classes – Star Vedic Academy</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --primary: #2D2A5E;
            --gold: #F5A623;
            --bg: #FFF9F0;
            --card: #fff;
            --text: #1A1A2E;
            --muted: #6A6A8B;
            --radius: 18px;
            --shadow: 0 4px 24px rgba(45, 42, 94, 0.10);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .topnav {
            background: #fff;
            padding: 0 5%;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(45, 42, 94, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--primary), #5855A0);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
        }

        .logo-text {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
        }

        .nav-tabs {
            display: flex;
            gap: 4px;
        }

        .nav-tab {
            text-decoration: none;
            color: var(--muted);
            font-size: 13px;
            font-weight: 500;
            padding: 7px 14px;
            border-radius: 10px;
            transition: all .2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-tab:hover,
        .nav-tab.active {
            color: var(--primary);
            background: rgba(45, 42, 94, 0.06);
            font-weight: 600;
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--gold));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
        }

        .user-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
        }

        .mob-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 20px;
            color: var(--primary);
            cursor: pointer;
        }

        .mobile-nav {
            display: none;
            position: fixed;
            top: 64px;
            left: 0;
            right: 0;
            background: #fff;
            z-index: 99;
            border-bottom: 1px solid rgba(45, 42, 94, 0.1);
            padding: 12px;
        }

        .mobile-nav.open {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .mobile-nav a {
            text-decoration: none;
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mobile-nav a.active {
            background: rgba(45, 42, 94, 0.06);
            color: var(--primary);
        }

        .main {
            padding: 32px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 32px;
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .page-header p {
            font-size: 14px;
            color: var(--muted);
        }

        /* FILTER TABS */
        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .filter-btn {
            padding: 9px 20px;
            border-radius: 100px;
            border: 2px solid rgba(45, 42, 94, 0.12);
            background: #fff;
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* SECTION TITLE */
        .cat-section {
            margin-bottom: 40px;
        }

        .cat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .cat-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }

        .cat-count-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 100px;
            margin-left: 8px;
        }

        /* COURSE CARDS */
        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }

        .course-card {
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all .3s;
            border: 1px solid rgba(45, 42, 94, 0.06);
            cursor: pointer;
        }

        .course-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(45, 42, 94, 0.16);
        }

        .cc-header {
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            position: relative;
        }

        .cc-time-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .cc-body {
            padding: 16px;
        }

        .cc-cat {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 100px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 8px;
        }

        .cc-body h4 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .cc-timing {
            font-size: 12px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .cc-enroll-btn {
            width: 100%;
            margin-top: 12px;
            background: linear-gradient(135deg, var(--primary), #5855A0);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 9px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all .2s;
        }

        .cc-enroll-btn:hover {
            opacity: .9;
            transform: translateY(-1px);
        }

        @keyframes slideInToast {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media(max-width:900px) {
            .nav-tabs {
                display: none;
            }

            .mob-toggle {
                display: block;
            }
        }

        @media(max-width:600px) {
            .course-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .main {
                padding: 20px 4%;
            }
        }
    </style>
</head>

<body>
    <nav class="topnav">
        <a class="logo" href="../index.html">
            <div class="logo-icon"><i class="fas fa-om"></i></div>
            <div>
                <div class="logo-text">Star Vedic Academy</div>
            </div>
        </a>
        <div class="nav-tabs">
            <a href="index.html" class="nav-tab"><i class="fas fa-home"></i> Dashboard</a>
            <a href="classes.html" class="nav-tab active"><i class="fas fa-book-open"></i> My Classes</a>
            <a href="live.html" class="nav-tab"><i class="fas fa-video"></i> Live Classes</a>
            <a href="payments.html" class="nav-tab"><i class="fas fa-rupee-sign"></i> Payments</a>
            <a href="certificates.html" class="nav-tab"><i class="fas fa-certificate"></i> Certificates</a>
        </div>
        <div class="nav-user">
            <div class="avatar">P</div>
            <span class="user-name">Priya Sharma</span>
            <button class="mob-toggle" onclick="document.getElementById('mobileNav').classList.toggle('open')"><i
                    class="fas fa-bars"></i></button>
        </div>
    </nav>
    <div class="mobile-nav" id="mobileNav">
        <a href="index.html"><i class="fas fa-home"></i> Dashboard</a>
        <a href="classes.html" class="active"><i class="fas fa-book-open"></i> My Classes</a>
        <a href="live.html"><i class="fas fa-video"></i> Live Classes</a>
        <a href="payments.html"><i class="fas fa-rupee-sign"></i> Payments</a>
        <a href="certificates.html"><i class="fas fa-certificate"></i> Certificates</a>
    </div>

    <div class="main">
        <div class="page-header">
            <h1>All Classes</h1>
            <p>35+ expert-led classes across 5 categories — all included in your ₹280/month plan</p>
        </div>

        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" onclick="filterCat('all',this)"><i class="fas fa-th"></i> All
                Classes</button>
            <button class="filter-btn" onclick="filterCat('health',this)"><i class="fas fa-heart-pulse"></i>
                Health</button>
            <button class="filter-btn" onclick="filterCat('arts',this)"><i class="fas fa-palette"></i> Arts</button>
            <button class="filter-btn" onclick="filterCat('languages',this)"><i class="fas fa-language"></i>
                Languages</button>
            <button class="filter-btn" onclick="filterCat('ladies',this)"><i class="fas fa-female"></i> Ladies
                Special</button>
            <button class="filter-btn" onclick="filterCat('kids',this)"><i class="fas fa-child"></i> Kids</button>
        </div>

        <div id="coursesContainer"></div>
    </div>

    <script>
        const COURSES = {
            health: {
                label: "Health & Wellness", icon: "🏥", color: "#4CAF50", bg: "linear-gradient(135deg,#E8F5E9,#C8E6C9)", catColor: "#2E7D32", catBg: "#E8F5E9", courses: [
                    { name: "Yoga", time: "5:00 AM", icon: "🧘" },
                    { name: "Pranayama Yoga Mudras", time: "6:00 AM", icon: "💨" },
                    { name: "Zumba", time: "6:00 AM", icon: "💃" },
                    { name: "Zumba", time: "10:00 AM", icon: "💃" },
                    { name: "Flower Therapy For Emotional Healing", time: "1:00 PM", icon: "🌸" },
                    { name: "5×5×5 Weight Loss Methods", time: "11:00 AM", icon: "🍎" },
                    { name: "PCOD Reverse", time: "10:00 AM", icon: "❤️" }
                ]
            },
            arts: {
                label: "Arts & Culture", icon: "🎨", color: "#FF6B6B", bg: "linear-gradient(135deg,#FCE4EC,#F8BBD0)", catColor: "#C62828", catBg: "#FCE4EC", courses: [
                    { name: "Annamacharya Keerthanalu", time: "11:00 AM", icon: "🎵" },
                    { name: "Bharatanatyam", time: "12:00 PM", icon: "💃" },
                    { name: "Thyagaraja Keerthanalu Class", time: "3:00 PM", icon: "🎶" },
                    { name: "Kuchipudi", time: "6:00 PM", icon: "🩰" },
                    { name: "Chess Basics", time: "6:00 PM", icon: "♟️" },
                    { name: "Chess Advance", time: "6:00 PM", icon: "♛" },
                    { name: "One Stroke Painting", time: "12:00 PM", icon: "🖌️" },
                    { name: "Kerala Mural", time: "6:00 PM", icon: "🎨" },
                    { name: "Numerology", time: "12:00 PM", icon: "🔢" },
                    { name: "AI Tools & Graphics", time: "7:00 PM", icon: "🤖" }
                ]
            },
            languages: {
                label: "Languages", icon: "🗣️", color: "#1565C0", bg: "linear-gradient(135deg,#E3F2FD,#BBDEFB)", catColor: "#0D47A1", catBg: "#E3F2FD", courses: [
                    { name: "Spoken English", time: "3:00 PM", icon: "🗣️" },
                    { name: "Telugu Basics, Padayalu, Kathalu", time: "11:00 AM", icon: "📖" }
                ]
            },
            ladies: {
                label: "Ladies Special", icon: "👩", color: "#C2185B", bg: "linear-gradient(135deg,#FCE4EC,#F48FB1)", catColor: "#880E4F", catBg: "#FCE4EC", courses: [
                    { name: "Saree Pre Pleating", time: "3:00 PM", icon: "👘" },
                    { name: "Saree Tassels", time: "4:00 PM", icon: "✂️" },
                    { name: "Chocolate Making & Baking Class", time: "1:00 PM", icon: "🍫" },
                    { name: "Beautician Course", time: "10:00 AM", icon: "💄" },
                    { name: "Millet Recipes", time: "3:00 PM", icon: "🥘" }
                ]
            },
            kids: {
                label: "Kids Classes", icon: "👶", color: "#F5A623", bg: "linear-gradient(135deg,#FFF8E1,#FFECB3)", catColor: "#E65100", catBg: "#FFF8E1", courses: [
                    { name: "Carnatic Music", time: "3:00 PM", icon: "🎵" },
                    { name: "Drawing Class", time: "2:00 PM", icon: "✏️" },
                    { name: "Kuchipudi", time: "6:00 PM", icon: "🩰" },
                    { name: "Bharatanatyam", time: "12:00 PM", icon: "💃" },
                    { name: "Doodle Art", time: "4:00 PM", icon: "🖍️" },
                    { name: "Melody Mind Camp", time: "5:00 PM", icon: "🎧" },
                    { name: "Chess Basics", time: "6:00 PM", icon: "♟️" },
                    { name: "Chess Advance", time: "6:00 PM", icon: "♛" },
                    { name: "English Motivational Stories", time: "4:00 PM", icon: "📚" },
                    { name: "Cursive Writing", time: "7:00 PM", icon: "✒️" }
                ]
            }
        };

        let activeFilter = 'all';

        function filterCat(cat, btn) {
            activeFilter = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCourses();
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.style.cssText = `position:fixed;bottom:24px;right:24px;z-index:9999;background:#2D2A5E;color:#fff;padding:14px 22px;border-radius:12px;font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(0,0,0,0.25);font-family:'Poppins',sans-serif;`;
            t.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 3000);
        }

        function renderCourses() {
            const container = document.getElementById('coursesContainer');
            container.innerHTML = '';
            const categories = activeFilter === 'all' ? Object.keys(COURSES) : [activeFilter];
            categories.forEach(key => {
                const cat = COURSES[key];
                const section = document.createElement('div');
                section.className = 'cat-section';
                let cardsHtml = cat.courses.map((c, i) => `
      <div class="course-card">
        <div class="cc-header" style="background:${cat.bg}">
          <span style="font-size:36px">${c.icon}</span>
          <div class="cc-time-badge"><i class="fas fa-clock"></i>${c.time}</div>
        </div>
        <div class="cc-body">
          <div class="cc-cat" style="color:${cat.catColor};background:${cat.catBg}">${cat.icon} ${cat.label}</div>
          <h4>${c.name}</h4>
          <div class="cc-timing"><i class="fas fa-clock"></i> ${c.time} daily</div>
          <button class="cc-enroll-btn" onclick="showToast('Enrolled in ${c.name}! Check Live Classes for the link. 🎉')">
            <i class="fas fa-plus"></i> Add to My Classes
          </button>
        </div>
      </div>
    `).join('');
                section.innerHTML = `
      <div class="cat-header">
        <div class="cat-pill" style="background:${cat.catColor}">${cat.icon} ${cat.label}</div>
        <span style="font-size:13px;color:var(--muted)">${cat.courses.length} classes</span>
      </div>
      <div class="course-grid">${cardsHtml}</div>
    `;
                container.appendChild(section);
            });
        }

        renderCourses();
    </script>
</body>

</html>
