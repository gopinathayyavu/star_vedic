<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Live Classes – Star Vedic Academy</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --primary: #2D2A5E;
            --gold: #F5A623;
            --bg: #FFF9F0;
            --text: #1A1A2E;
            --muted: #6A6A8B;
            --radius: 18px;
            --shadow: 0 4px 24px rgba(45, 42, 94, 0.10);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .topnav {
            background: #fff;
            padding: 0 5%;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(45, 42, 94, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--primary), #5855A0);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
        }

        .logo-text {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
        }

        .nav-tabs {
            display: flex;
            gap: 4px;
        }

        .nav-tab {
            text-decoration: none;
            color: var(--muted);
            font-size: 13px;
            font-weight: 500;
            padding: 7px 14px;
            border-radius: 10px;
            transition: all .2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-tab:hover,
        .nav-tab.active {
            color: var(--primary);
            background: rgba(45, 42, 94, 0.06);
            font-weight: 600;
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--gold));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
        }

        .user-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
        }

        .mob-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 20px;
            color: var(--primary);
            cursor: pointer;
        }

        .mobile-nav {
            display: none;
            position: fixed;
            top: 64px;
            left: 0;
            right: 0;
            background: #fff;
            z-index: 99;
            border-bottom: 1px solid rgba(45, 42, 94, 0.1);
            padding: 12px;
        }

        .mobile-nav.open {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .mobile-nav a {
            text-decoration: none;
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mobile-nav a.active {
            background: rgba(45, 42, 94, 0.06);
            color: var(--primary);
        }

        .main {
            padding: 32px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 32px;
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .page-header p {
            font-size: 14px;
            color: var(--muted);
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 18px;
            margin-bottom: 40px;
        }

        .live-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(45, 42, 94, 0.06);
            transition: all .3s;
        }

        .live-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 36px rgba(45, 42, 94, 0.14);
        }

        .live-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 100px;
        }

        .badge-live {
            background: #E8F5E9;
            color: #2E7D32;
        }

        .badge-upcoming {
            background: #E3F2FD;
            color: #1565C0;
        }

        .badge-done {
            background: #F5F5F5;
            color: #757575;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .3;
            }
        }

        .live-card h3 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }

        .live-card-meta {
            font-size: 12px;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 16px;
        }

        .live-card-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .join-btn {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-family: 'Poppins', sans-serif;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .join-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(76, 175, 80, 0.35);
        }

        .join-btn.upcoming {
            background: linear-gradient(135deg, var(--primary), #5855A0);
        }

        .join-btn.done {
            background: #9E9E9E;
            cursor: default;
        }

        .rec-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .rec-item {
            background: #fff;
            border-radius: var(--radius);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(45, 42, 94, 0.06);
        }

        .rec-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(45, 42, 94, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .rec-info {
            flex: 1;
        }

        .rec-info h4 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .rec-info p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 3px;
        }

        .watch-btn {
            background: none;
            border: 2px solid var(--primary);
            color: var(--primary);
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all .2s;
            white-space: nowrap;
        }

        .watch-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        @media(max-width:900px) {
            .nav-tabs {
                display: none;
            }

            .mob-toggle {
                display: block;
            }
        }

        @media(max-width:600px) {
            .main {
                padding: 20px 4%;
            }

            .live-grid {
                grid-template-columns: 1fr;
            }

            .rec-item {
                flex-direction: column;
                text-align: center;
            }

            .rec-item .watch-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <nav class="topnav">
        <a class="logo" href="../index.html">
            <div class="logo-icon"><i class="fas fa-om"></i></div>
            <div>
                <div class="logo-text">Star Vedic Academy</div>
            </div>
        </a>
        <div class="nav-tabs">
            <a href="index.html" class="nav-tab"><i class="fas fa-home"></i> Dashboard</a>
            <a href="classes.html" class="nav-tab"><i class="fas fa-book-open"></i> My Classes</a>
            <a href="live.html" class="nav-tab active"><i class="fas fa-video"></i> Live Classes</a>
            <a href="payments.html" class="nav-tab"><i class="fas fa-rupee-sign"></i> Payments</a>
            <a href="certificates.html" class="nav-tab"><i class="fas fa-certificate"></i> Certificates</a>
        </div>
        <div class="nav-user">
            <div class="avatar">P</div>
            <span class="user-name">Priya Sharma</span>
            <button class="mob-toggle" onclick="document.getElementById('mn').classList.toggle('open')"><i
                    class="fas fa-bars"></i></button>
        </div>
    </nav>
    <div class="mobile-nav" id="mn">
        <a href="index.html"><i class="fas fa-home"></i> Dashboard</a>
        <a href="classes.html"><i class="fas fa-book-open"></i> My Classes</a>
        <a href="live.html" class="active"><i class="fas fa-video"></i> Live Classes</a>
        <a href="payments.html"><i class="fas fa-rupee-sign"></i> Payments</a>
        <a href="certificates.html"><i class="fas fa-certificate"></i> Certificates</a>
    </div>
    <div class="main">
        <div class="page-header">
            <h1>Live Classes</h1>
            <p>Today's schedule — join classes via Zoom. All sessions are also recorded.</p>
        </div>

        <div class="section-title"><i class="fas fa-broadcast-tower" style="color:#E53935"></i> Today's Schedule —
            Monday, May 4, 2026</div>
        <div class="live-grid" id="liveGrid"></div>

        <div class="section-title" style="margin-top:10px;"><i class="fas fa-history" style="color:var(--gold)"></i>
            Previous Recordings</div>
        <div class="rec-list" id="recList"></div>
    </div>

    <script>
        const todayClasses = [
            { name: "Yoga", time: "5:00 AM", zoom: "846 2839 1023", status: "live", icon: "🧘", cat: "Health" },
            { name: "Pranayama Yoga Mudras", time: "6:00 AM", zoom: "712 4829 3847", status: "done", icon: "💨", cat: "Health" },
            { name: "Zumba", time: "10:00 AM", zoom: "523 9284 1038", status: "upcoming", icon: "💃", cat: "Health" },
            { name: "Bharatanatyam", time: "12:00 PM", zoom: "819 2374 5629", status: "upcoming", icon: "💃", cat: "Arts" },
            { name: "Numerology", time: "12:00 PM", zoom: "627 3481 9274", status: "upcoming", icon: "🔢", cat: "Arts" },
            { name: "Spoken English", time: "3:00 PM", zoom: "934 1829 3847", status: "upcoming", icon: "🗣️", cat: "Languages" },
            { name: "Thyagaraja Keerthanalu", time: "3:00 PM", zoom: "481 9273 6482", status: "upcoming", icon: "🎶", cat: "Arts" },
            { name: "Kuchipudi", time: "6:00 PM", zoom: "723 4819 2384", status: "upcoming", icon: "🩰", cat: "Arts" },
            { name: "AI Tools & Graphics", time: "7:00 PM", zoom: "523 4782 9183", status: "upcoming", icon: "🤖", cat: "Arts" }
        ];
        const recordings = [
            { name: "Yoga – Morning Session", date: "May 3, 2026", duration: "55 min", icon: "🧘" },
            { name: "Bharatanatyam – Basics", date: "May 3, 2026", duration: "60 min", icon: "💃" },
            { name: "Spoken English – Conversation", date: "May 2, 2026", duration: "45 min", icon: "🗣️" },
            { name: "Flower Therapy", date: "May 1, 2026", duration: "50 min", icon: "🌸" },
            { name: "Chess Basics", date: "April 30, 2026", duration: "40 min", icon: "♟️" },
            { name: "Drawing Class", date: "April 29, 2026", duration: "55 min", icon: "✏️" }
        ];

        function showToast(msg) {
            const t = document.createElement('div');
            t.style.cssText = `position:fixed;bottom:24px;right:24px;z-index:9999;background:#2D2A5E;color:#fff;padding:14px 22px;border-radius:12px;font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(0,0,0,0.25);font-family:'Poppins',sans-serif;`;
            t.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 3000);
        }

        document.getElementById('liveGrid').innerHTML = todayClasses.map(c => {
            const isLive = c.status === 'live', isUp = c.status === 'upcoming', isDone = c.status === 'done';
            return `<div class="live-card">
    <div class="live-card-top">
      <span style="font-size:28px">${c.icon}</span>
      <span class="live-badge ${isLive ? 'badge-live' : isUp ? 'badge-upcoming' : 'badge-done'}">
        ${isLive ? '<span class="live-dot"></span>' : ''}
        ${isLive ? 'LIVE NOW' : isUp ? 'UPCOMING' : 'COMPLETED'}
      </span>
    </div>
    <h3>${c.name}</h3>
    <div class="live-card-meta">
      <span><i class="fas fa-clock"></i> ${c.time}</span>
      <span><i class="fas fa-tag"></i> ${c.cat}</span>
      <span><i class="fab fa-zoom"></i> Zoom ID: ${c.zoom}</span>
    </div>
    <button class="join-btn ${isUp ? 'upcoming' : isDone ? 'done' : ''}" ${isDone ? 'disabled' : ''} onclick="showToast('Opening Zoom for ${c.name}… Meeting ID: ${c.zoom} 🎥')">
      <i class="fas ${isDone ? 'fa-check' : 'fa-video'}"></i>
      ${isDone ? 'Session Completed' : 'Join Zoom Class'}
    </button>
  </div>`;
        }).join('');

        document.getElementById('recList').innerHTML = recordings.map(r => `
  <div class="rec-item">
    <div class="rec-icon">${r.icon}</div>
    <div class="rec-info">
      <h4>${r.name}</h4>
      <p><i class="fas fa-calendar"></i> ${r.date} &nbsp;·&nbsp; <i class="fas fa-clock"></i> ${r.duration}</p>
    </div>
    <button class="watch-btn" onclick="showToast('Loading recording for ${r.name}… ▶️')">
      <i class="fas fa-play"></i> Watch
    </button>
  </div>
`).join('');
    </script>
</body>

</html>
