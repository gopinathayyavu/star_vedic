<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign In | Star Vedic Academy</title>

    <!-- GOOGLE FONTS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- FONT AWESOME -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- TAILWIND -->

    <script src="https://cdn.tailwindcss.com"></script>

    <script>

        tailwind.config = {

            theme: {

                extend: {

                    colors: {

                        primary: '#0F2C23',
                        accent: '#F28C28',
                        gold: '#D4AF37',
                        cream: '#FFF9F0',
                        beige: '#F5EFE6',
                        dark: '#1E1E1E',
                        deepgreen: '#1A3F34',

                    },

                    fontFamily: {

                        display: ['Playfair Display', 'serif'],
                        body: ['Inter', 'sans-serif'],

                    }

                }

            }

        }

    </script>

    <style>
        * {

            box-sizing: border-box;
            scroll-behavior: smooth;

        }

        body {

            font-family: 'Inter', sans-serif;
            background: #FFF9F0;
            overflow-x: hidden;

        }

        .font-display {

            font-family: 'Playfair Display', serif;

        }

        .hero-bg {

            background:
                linear-gradient(rgba(15, 44, 35, 0.82),
                    rgba(15, 44, 35, 0.9)),
                url('https://images.unsplash.com/photo-1506126613408-eca07ce68773?q=80&w=1600');

            background-size: cover;
            background-position: center;

        }

        .glass-card {

            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);

        }

        .btn-gold {

            background: linear-gradient(135deg, #D4AF37, #F28C28);
            color: #0F2C23;
            font-weight: 700;
            border-radius: 999px;
            transition: .3s;
            box-shadow: 0 10px 25px rgba(242, 140, 40, 0.3);

        }

        .btn-gold:hover {

            transform: translateY(-3px);

        }

        .input-box {

            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;

        }

        .input-box::placeholder {

            color: rgba(255, 255, 255, 0.55);

        }

        .input-box:focus {

            outline: none;
            border-color: rgba(212, 175, 55, 0.5);

        }

        .otp-input {

            letter-spacing: 12px;
            font-size: 1.5rem;
            text-align: center;

        }

        .success-animation {

            animation: pop .4s ease;

        }

        @keyframes pop {

            0% {

                transform: scale(.8);
                opacity: 0;

            }

            100% {

                transform: scale(1);
                opacity: 1;

            }

        }
    </style>

</head>

<body>

    <section class="hero-bg min-h-screen flex items-center justify-center px-5 py-16">

        <div class="glass-card w-full max-w-md rounded-[2.5rem] p-8 md:p-10 text-center success-animation">

            <!-- LOGO -->

            <div class="w-20 h-20 bg-gold rounded-full flex items-center justify-center mx-auto shadow-2xl">

                <i class="fas fa-om text-primary text-3xl"></i>

            </div>

            <h1 class="font-display text-4xl md:text-5xl font-bold text-white mt-8">

                Welcome Back

            </h1>

            <p class="text-white/70 mt-4 text-sm leading-relaxed">

                Sign in to continue your holistic learning journey
                with Star Vedic Academy.

            </p>

            <!-- FORM -->

            <div class="mt-10">

                <!-- MOBILE INPUT -->

                <div>

                    <label class="text-white/70 text-sm font-medium block text-left mb-3">

                        Mobile Number

                    </label>

                    <div class="relative">

                        <i class="fas fa-phone absolute left-5 top-1/2 -translate-y-1/2 text-white/50"></i>

                        <input type="tel" id="mobileInput" maxlength="10" placeholder="Enter mobile number"
                            class="input-box w-full rounded-full py-4 pl-14 pr-5">

                    </div>

                </div>

                <!-- OTP BOX -->

                <div id="otpContainer" class="hidden mt-8">

                    <label class="text-white/70 text-sm font-medium block text-left mb-3">

                        Enter OTP

                    </label>

                    <input type="text" id="otpInput" maxlength="6" placeholder="------"
                        class="otp-input input-box w-full rounded-2xl py-4 px-5">

                    <!-- RESEND -->

                    <div class="flex items-center justify-between mt-4 text-sm">

                        <span class="text-white/50">
                            OTP sent successfully
                        </span>

                        <button id="resendBtn" class="text-gold font-semibold hover:underline">

                            Resend OTP

                        </button>

                    </div>

                </div>

                <!-- BUTTON -->

                <button id="actionBtn" class="btn-gold w-full py-4 mt-10 text-lg">

                    Get OTP

                </button>

            </div>

            <!-- DEMO NOTE -->

            <div class="mt-8 bg-white/10 rounded-2xl p-4 border border-white/10">

                <p class="text-white/60 text-xs leading-relaxed">

                    Demo OTP:
                    <span class="text-gold font-bold">
                        123456
                    </span>

                </p>

            </div>

        </div>

    </section>

    <script>

        const actionBtn =
            document.getElementById('actionBtn');

        const otpContainer =
            document.getElementById('otpContainer');

        const mobileInput =
            document.getElementById('mobileInput');

        const otpInput =
            document.getElementById('otpInput');

        const resendBtn =
            document.getElementById('resendBtn');

        let otpVisible = false;

        // MAIN BUTTON

        actionBtn.addEventListener('click', () => {

            // SHOW OTP

            if (!otpVisible) {

                const mobile =
                    mobileInput.value.trim();

                if (mobile.length !== 10) {

                    alert('Please enter valid mobile number');

                    return;

                }

                otpContainer.classList.remove('hidden');

                otpVisible = true;

                actionBtn.innerHTML = 'Verify OTP';

                mobileInput.disabled = true;

                otpInput.focus();

            }

            // VERIFY OTP

            else {

                const otp =
                    otpInput.value.trim();

                if (otp !== '123456') {

                    alert('Invalid OTP');

                    return;

                }

                // SAVE LOGIN

                localStorage.setItem(
                    'isLoggedIn',
                    'true'
                );

                // REDIRECT

                actionBtn.innerHTML =
                    'Verified Successfully';

                setTimeout(() => {

                    window.location.href =
                        'index.html';

                }, 1200);

            }

        });

        // RESEND

        resendBtn.addEventListener('click', () => {

            alert('OTP Resent Successfully');

        });

    </script>

</body>

</html>
